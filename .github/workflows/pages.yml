name: Publish KURO web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kuro-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KURO
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install pinned Dioxus CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10/dx-x86_64-unknown-linux-gnu.tar.gz \
            -o /tmp/kuro-dx.tar.gz
          tar -xzf /tmp/kuro-dx.tar.gz -C /tmp dx
          sudo install -m 0755 /tmp/dx /usr/local/bin/dx
          dx --version

      - name: Set GitHub Pages base path (build only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path("apps/web/Dioxus.toml")
          config = file.read_text()
          assert "[web.app]\n" in config and "base_path" not in config
          file.write_text(config.replace("[web.app]\n", '[web.app]\nbase_path = "Kuro"\n', 1))
          PY

      - name: Build KURO for browser
        run: dx build --platform web --package kuro-web --release --locked

      - name: Prepare assets for repository subpath
        run: |
          python3 - <<'PY'
          from pathlib import Path
          out = Path("target/dx/kuro-web/release/web/public")
          assert (out / "index.html").is_file(), "Missing KURO index.html"
          assert (out / "style.css").is_file(), "Missing KURO style.css"
          assert (out / "storage.js").is_file(), "Missing KURO storage.js"
          css = out / "style.css"
          css.write_text(
              css.read_text()
              .replace("url('/fonts/", "url('/Kuro/fonts/")
              .replace('url("/fonts/', 'url("/Kuro/fonts/')
              .replace("url('/observatory.svg'", "url('/Kuro/observatory.svg'")
              .replace('url("/observatory.svg"', 'url("/Kuro/observatory.svg"')
          )
          page = out / "index.html"
          html = page.read_text()
          html = html.replace('href="/style.css"', 'href="/Kuro/style.css"')
          html = html.replace("href='/style.css'", "href='/Kuro/style.css'")
          assert "assets/" in html, "Compiled WebAssembly loader missing"
          page.write_text(html)
          (out / "404.html").write_text(html)
          (out / ".nojekyll").touch()
          print("KURO static site prepared:", out)
          print("Files:", len(list(out.rglob("*"))))
          PY

      - name: Upload publishable site
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/dx/kuro-web/release/web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy KURO
        id: deployment
        uses: actions/deploy-pages@v4
